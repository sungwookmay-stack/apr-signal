name: Decodo Top100 - manual 8-request smoke test

on:
  workflow_dispatch:
    inputs:
      free_plan_confirmed:
        description: 'Active Free plan, no paid top-up, at least $0.02 free credit; run this test once only'
        required: true
        type: boolean
        default: false

# No checkout, repository writes, deployment or third-party actions.
permissions: {}
concurrency:
  group: decodo-top100-manual-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'sungwookmay-stack/apr-signal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate parser and perform at most eight official API requests
        env:
          DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
          FREE_PLAN_CONFIRMED: ${{ inputs.free_plan_confirmed }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          from urllib.parse import urlsplit
          
          ENDPOINT = "https://data.decodo.com/v1/scrape"
          MARKETS = (("US", "com"), ("GB", "co.uk"), ("AE", "ae"), ("BR", "com.br"))
          
          class InvalidResponse(Exception):
              pass
          
          def parsed_page(value):
              if isinstance(value, dict):
                  if isinstance(value.get("results"), list) and "page" in value:
                      return value
                  for key in ("results", "content"):
                      if key in value:
                          try:
                              return parsed_page(value[key])
                          except InvalidResponse:
                              pass
              elif isinstance(value, list) and len(value) == 1:
                  return parsed_page(value[0])
              elif isinstance(value, str):
                  try:
                      return parsed_page(json.loads(value))
                  except (ValueError, RecursionError):
                      pass
              raise InvalidResponse()
          
          def integer(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return value
              if isinstance(value, str) and re.fullmatch(r"[0-9]+", value):
                  return int(value)
              return None
          
          def inspect_page(document, domain, number):
              page = parsed_page(document)
              url = urlsplit(str(page.get("url", "")))
              # Do not accept a wrong market/category or silently renumber a repeated page.
              location_ok = url.hostname in ("amazon." + domain, "www.amazon." + domain)
              category_ok = "beauty" in url.path.split("/")
              page_ok = integer(page.get("page")) == number
              rows = page["results"]
              normalized = []
              invalid = 0
              for row in rows:
                  if not isinstance(row, dict):
                      invalid += 1
                      continue
                  asin = row.get("asin")
                  title = row.get("title")
                  pos = integer(row.get("pos"))
                  if not isinstance(asin, str) or not re.fullmatch(r"[A-Z0-9]{10}", asin):
                      invalid += 1
                      continue
                  normalized.append((pos, asin, isinstance(title, str) and bool(title.strip())))
              ranks = [r[0] for r in normalized]
              complete = (location_ok and category_ok and page_ok and invalid == 0
                          and len(rows) == 50 and len(set(ranks)) == 50
                          and set(ranks) == set(range((number-1)*50+1, number*50+1))
                          and len({r[1] for r in normalized}) == 50
                          and all(r[2] for r in normalized))
              return normalized, {"rows": len(rows), "valid_asins": len(normalized),
                                  "titles": sum(r[2] for r in normalized),
                                  "market_ok": location_ok, "beauty_ok": category_ok,
                                  "page_ok": page_ok, "complete_50": complete}
          
          def self_test():
              def sample(number):
                  return {"page": number, "url": "https://www.amazon.com/Best-Sellers/zgbs/beauty/",
                          "results": [{"pos": i, "asin": "B"+str(i).zfill(9), "title": "fixture"}
                                      for i in range((number-1)*50+1, number*50+1)]}
              for number in (1, 2):
                  fixture = sample(number)
                  assert inspect_page(fixture, "com", number)[1]["complete_50"]
                  wrapped = {"results": [{"content": json.dumps({"results": fixture})}]}
                  assert inspect_page(wrapped, "com", number)[1]["complete_50"]
              fixture = sample(1)
              assert not inspect_page(fixture, "co.jp", 1)[1]["complete_50"]
              assert not inspect_page(fixture, "com", 2)[1]["complete_50"]
              fixture["results"][0]["title"] = ""
              assert not inspect_page(fixture, "com", 1)[1]["complete_50"]
              fixture = sample(1)
              fixture["results"][1] = fixture["results"][0]
              assert not inspect_page(fixture, "com", 1)[1]["complete_50"]
              fixture = sample(1)
              fixture["url"] = "https://www.amazon.com/zgbs/mobile-apps/"
              assert not inspect_page(fixture, "com", 1)[1]["complete_50"]
              try:
                  parsed_page({"unexpected": "shape"})
              except InvalidResponse:
                  pass
              else:
                  raise AssertionError()
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def main():
              self_test()
              print("Offline parser checks passed.")
              if os.environ.get("SELF_TEST_ONLY") == "1":
                  return
              # This manual job must not be rerun to silently double the agreed eight calls.
              if os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
                  sys.exit("Re-runs disabled; no API request made.")
              if os.environ.get("FREE_PLAN_CONFIRMED") != "true":
                  sys.exit("Confirm active free plan and at least $0.02 free balance first.")
              token = os.environ.get("DECODO_API_KEY", "").strip()
              if not token or token.lower().startswith(("bearer ", "curl ")) or any(c.isspace() for c in token):
                  sys.exit("Missing or malformed DECODO_API_KEY; no API request made.")
              opener = urllib.request.build_opener(NoRedirect())
              calls = 0
              all_complete = True
              print("Manual smoke test: at most 8 attempts, no retries or raw response logging.")
              print("Expected successful-call debit: $0.008 equivalent; actual debit requires dashboard comparison.")
              for country, domain in MARKETS:
                  combined = []
                  pages_ok = True
                  for number in (1, 2):
                      payload = {"target": "amazon_bestsellers", "query": "beauty",
                                 "domain": domain, "page_from": str(number),
                                 "parse": True, "proxy_pool": "premium"}
                      request = urllib.request.Request(
                          ENDPOINT, data=json.dumps(payload).encode(),
                          headers={"Authorization": "Bearer " + token,
                                   "Content-Type": "application/json", "Accept": "application/json"},
                          method="POST")
                      if calls >= 8:
                          sys.exit("Attempt cap reached.")
                      calls += 1
                      try:
                          with opener.open(request, timeout=120) as response:
                              raw = response.read(5_000_001)
                              if len(raw) > 5_000_000:
                                  raise InvalidResponse()
                              document = json.loads(raw)
                          rows, stats = inspect_page(document, domain, number)
                      except urllib.error.HTTPError as error:
                          # Never log error body, headers, URLs or exception strings.
                          print(json.dumps({"country": country, "page": number,
                                            "attempts": calls, "http_status": error.code}))
                          sys.exit("Stopped on HTTP error; no retries.")
                      except Exception:
                          print(json.dumps({"country": country, "page": number,
                                            "attempts": calls, "status": "unverified_response_or_transport"}))
                          sys.exit("Stopped safely; no raw response or exception logged.")
                      combined.extend(rows)
                      pages_ok = pages_ok and stats["complete_50"]
                      print(json.dumps({"country": country, "page": number, **stats}))
                  complete = (pages_ok and len(combined) == 100
                              and len({r[1] for r in combined}) == 100
                              and {r[0] for r in combined} == set(range(1, 101)))
                  print(json.dumps({"country": country, "unique_asins": len({r[1] for r in combined}),
                                    "title_count": sum(r[2] for r in combined),
                                    "complete_top100": complete}))
                  all_complete = all_complete and complete
              print(json.dumps({"attempts": calls, "all_four_complete": all_complete,
                                "raw_responses_saved": False, "actual_debit_verified": False}))
              if not all_complete:
                  sys.exit("Incomplete Top100; not approved for production.")
          
          if __name__ == "__main__":
              main()
          
          PY
