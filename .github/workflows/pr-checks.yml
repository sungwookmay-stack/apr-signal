name: APR SIGNAL - pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests (mock API only)
        run: python -m unittest discover -s tests -v
      - name: Validate bottom stage on saved APR daily OHLCV (offline)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from indicator_engine import calculate
          market=json.loads(Path('data/market.json').read_text(encoding='utf-8'))
          output=calculate(market['series'])
          bottom=output['bottom']
          assert bottom['data_ready'], bottom
          assert bottom['date']==market['series'][-1]['date']
          assert len(bottom['checks'])==8
          assert bottom['not_prediction']
          print('APR bottom stage:',bottom['stage'],'date:',bottom['date'])
          PY
      - name: JavaScript syntax
        run: node --check assets/app.js
      - name: Standalone sensitivity JS syntax
        run: node --check assets/sensitivity.js
      - name: Investor flow JS syntax
        run: node --check assets/flows.js
      - name: Build research snapshots without network or keys
        run: python build_research_data.py
      - name: Verify research JavaScript syntax
        run: node --check assets/research_dashboard.js
      - name: Test APR financial valuation offline Trend and retail panels
        run: |
          node tests/smoke_research.cjs
          node tests/smoke_valuation.cjs
          node --check assets/valuation_scenario.js
      - name: Scenario lab and KITA data provenance smoke
        run: node tests/smoke_sensitivity.cjs
      - name: Institutional APR flow and lending source QA
        run: node tests/smoke_flows.cjs
      - name: Verify 5 moving averages separate RSI and MACD charts
        run: node tests/smoke_technical_2026.cjs
      - name: Dashboard smoke
        run: node tests/smoke_demand.cjs
      - name: Verify Korean news rendering
        run: node tests/smoke_news.cjs
      - name: Verify South America countries without external APIs
        run: node tests/smoke_latam.cjs
      - name: Verify Korean SEC KBTY filing UI
        run: node tests/smoke_kbty_sec.cjs
      - name: Test official Customs freight parsing
        run: python -m unittest tests/test_freight_official.py -v
