name: APR SIGNAL - free data refresh and Pages

on:
  push:
    branches: [main]
  schedule:
    # 07:30 Korea time (KST, UTC+9) = 22:30 UTC on the preceding date; daily. Cron execution may be delayed.
    - cron: '30 22 * * *'
    # 16:00 Korea time (KST) = 07:00 UTC; close-price technicals + local news (no paid APIs).
    - cron: '0 7 * * *'
    # 20:30 KST = 11:30 UTC. KRX final investor print is expected after 20:00.
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apr-signal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check indicator and parsing logic
        run: python -m unittest discover -s tests -v
      - name: Verify browser application JavaScript syntax
        run: node --check assets/app.js
      - name: Verify research dashboard JavaScript syntax
        run: node --check assets/research_dashboard.js
      - name: Verify standalone sensitivity JavaScript syntax
        run: node --check assets/sensitivity.js
      - name: Verify APR institutional flow module syntax
        run: node --check assets/flows.js
      - name: Test Amazon ranking visibility (with and without API / charts)
        run: node tests/smoke_demand.cjs
      - name: Verify ownership and source provenance
        run: node tests/smoke_source_provenance.cjs
      - name: Verify Korean news rendering
        run: node tests/smoke_news.cjs
      - name: Verify South America countries without external APIs
        run: node tests/smoke_latam.cjs
      - name: Verify Korean SEC KBTY filing UI
        run: node tests/smoke_kbty_sec.cjs
      - name: Test official Customs freight parsing
        run: python -m unittest tests/test_freight_official.py -v
      - name: Fetch data, calculate signals, update verified news
        # Code-only pushes avoid consuming credits; explicit [collect-now] commit runs one authorized refresh.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect-now]'))
        env:
          APISH_KEY: ${{ secrets.APISH_KEY }}
        run: python build_data.py
      - name: Decodo Top50 gated morning collection
        # User authorized the public Top50 summary and free-plan collection.
        # Python additionally enforces KST Mon/Wed/Fri/Sat/Sun and no reruns.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[top50-initial-20261112]') || contains(github.event.head_commit.message, '[top50-uae-20261112]')))
        env:
          DECODO_INITIAL_RUN: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[top50-uae-20261112]') && 'uae-recheck-20261112' || github.event_name == 'push' && contains(github.event.head_commit.message, '[top50-initial-20261112]') && 'initial-20261112' || '' }}
          DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
          DECODO_TOP50_ENABLED: 'true'
          DECODO_PUBLIC_USE_AUTHORIZED: 'true'
          DECODO_FREE_PLAN_CONFIRMED: 'true'
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python decodo_top50.py
      - name: Verify Top50 gating, completeness, movement and UI without API calls
        run: |
          python -m unittest discover -s tests -p test_decodo_top50.py -v
          node tests/smoke_top50.cjs
      - name: Refresh bottom-formation analysis from saved OHLCV (free)
        # [bottom-now] triggers no stock, freight, Amazon or Trends API calls.
        # Morning and 16:00 collections already recalculate indicator_engine.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[bottom-now]')
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from build_data import DATA, save, read_json
          from indicator_engine import calculate
          market=read_json(DATA/'market.json',{})
          series=market.get('series') or []
          if len(series)<65:
              raise RuntimeError('No valid APR daily series for bottom analysis')
          technical=calculate(series)
          technical['last']['source']=market.get('meta',{}).get('stock_source')
          save('technical.json',technical)
          status=read_json(DATA/'status.json',{})
          status['bottom_analysis_asof']=technical['bottom']['date']
          status['bottom_stage']=technical['bottom']['stage']
          status['bottom_analysis_checked_at_utc']=dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds')
          save('status.json',status)
          print('Bottom analysis:',json.dumps({
              'date':technical['bottom']['date'],
              'stage':technical['bottom']['stage'],
              'score':technical['bottom']['score'],
              'support':technical['bottom'].get('reference',{}).get('recent_20d_low')
          },ensure_ascii=False))
          PY
      - name: Afternoon 16:00 KST - free close-price technical indicators and local news
        # Actual APR daily OHLCV, recalculated technicals and free RSS only.
        # No Scrape.do, API.SH, ECB or Customs freight requests in this step.
        if: (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[afternoon-now]'))
        run: python afternoon_refresh.py
      - name: Source-verified Customs historical backfill (free, no paid APIs)
        # A one-off [freight-now] push collects Customs releases and free stock
        # history only, without Amazon or Google Trends API credits.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[freight-now]')
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from build_data import collect_market, read_json, save, DATA
          market, technical = collect_market(refresh_fx=False, refresh_freight=True)
          status = read_json(DATA/'status.json', {})
          if not isinstance(status, dict):
              status = {}
          status.update({
              'generated_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'price_last': market.get('meta', {}).get('stock_last'),
              'fx_last': market.get('meta', {}).get('usd_fx_last'),
              'technical_last': technical.get('last', {}).get('date'),
              'technical_ohlc_days': technical.get('valid_high_low', 0),
              'freight_latest_month': market.get('logistics',{}).get('last_verified_month'),
              'freight_latest_check_failed': market.get('logistics',{}).get('last_fetch_failed'),
              'freight_missing_months': market.get('logistics',{}).get('unverified_months',[]),
              'errors': market.get('meta',{}).get('errors',[])
          })
          save('status.json',status)
          bootstrap = DATA/'bootstrap.js'
          previous={}
          if bootstrap.exists():
              txt=bootstrap.read_text(encoding='utf-8')
              prefix='window.APR_BOOTSTRAP = '
              if txt.startswith(prefix):
                  try:
                      previous=json.loads(txt[len(prefix):].strip().removesuffix(';'))
                  except (ValueError,TypeError):
                      pass
          previous.update({'market':market,'technical':technical,'status':status})
          bootstrap.write_text('window.APR_BOOTSTRAP = '+
              json.dumps(previous,ensure_ascii=False,separators=(',',':'))+';\n',
              encoding='utf-8')
          print('Official freight months verified:',
                len([r for r in market.get('logistics',{}).get('sea',[]) if r.get('source_url')]))
          print('Missing/unverified months:',status['freight_missing_months'])
          PY
      - name: KITA RADIS monthly market reference rates (free public page)
        # The official site updates its reference freight in the first week;
        # check each morning and on explicit [kita-now] / [freight-now].
        # No paid Amazon or Google Trends APIs involved.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[kita-now]') || contains(github.event.head_commit.message, '[freight-now]')))
        run: python kita_rates.py
      - name: Install free KRX client for end-of-day investor and short data
        # pykrx is only installed when the investor-flow collection runs.
        if: (github.event_name == 'schedule' && (github.event.schedule == '30 22 * * *' || github.event.schedule == '30 11 * * *')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[flows-now]'))
        run: |
          python -m pip install --disable-pip-version-check --quiet pykrx || echo "pykrx installation unavailable: retaining prior verified values"
      - name: Collect APR investor, pension, short and KSD lending (free)
        # After 20:00 the KRX final investor print should be available.
        # API keys remain in runner secrets; missing/blocked fields stay null.
        if: (github.event_name == 'schedule' && (github.event.schedule == '30 22 * * *' || github.event.schedule == '30 11 * * *')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[flows-now]'))
        env:
          KSD_SLB_API_KEY: ${{ secrets.KSD_SLB_API_KEY }}
          FSC_STOCK_LENDING_API_KEY: ${{ secrets.FSC_STOCK_LENDING_API_KEY }}
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python flows_collect.py
      - name: News-only manual refresh
        # [news-now] remains news-only for separate manual tests.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[news-now]')
        run: python -c "from build_data import collect_news; collect_news()"
      - name: Refresh Korean news only without Amazon or paid APIs
        # [translate-now] avoids a fresh Amazon collection, preserving credits.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[translate-now]')
        run: python news_localizer.py --refresh-file
      - name: Verify KBTY SEC EDGAR filings (free; fund-series match required)
        # Daily morning SEC refresh; [sec-now] checks SEC only without Amazon/Trends.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[collect-now]') || contains(github.event.head_commit.message, '[sec-now]')))
        run: python kbty_sec.py --refresh
      - name: Refresh KBTY SEC EDGAR series-verified filings (free)
        # SEC only. [sec-now] never invokes Amazon/Trends or whole APR collection.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[collect-now]') || contains(github.event.head_commit.message, '[sec-now]')))
        run: python kbty_sec.py --refresh
      - name: Backfill June 2025 APR prices and official FX (no paid data APIs)
        # [price-backfill] fetches only free public APR OHLCV and ECB FX history.
        # Do not execute the Amazon/Trends full collector on this mode.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[price-backfill]')
        run: |
          python - <<'PY'
          from build_data import collect_market, read_json, save, DATA
          market, technical = collect_market(refresh_fx=True, refresh_freight=False)
          status = read_json(DATA/'status.json', {})
          if isinstance(status, dict):
              status.update({
                  'price_last': market.get('meta', {}).get('stock_last'),
                  'price_coverage_start': market.get('meta', {}).get('coverage_start'),
                  'fx_last': market.get('meta', {}).get('usd_fx_last'),
                  'technical_last': technical.get('last', {}).get('date'),
                  'technical_ohlc_days': technical.get('valid_high_low', 0)
              })
              save('status.json', status)
          print('Free historical price/FX backfill complete:', market.get('meta', {}).get('coverage_start'))
          PY
      - name: Query official OpenDART ownership and CFS with repository secret
        # The key is supplied only to the runner, not written to public output.
        # [dart-now] checks free OpenDART without running Amazon or other APIs.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[dart-now]'))
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python dart_ownership.py
          python dart_financials.py
          python dart_capital.py
      - name: Track public US Medicube product review counts (no API tokens)
        # Only official product-level aggregate counters. Never duplicate Amazon rankings.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[retail-now]'))
        run: python retail_reviews.py
      - name: Refresh FSC verified APR stock lending after 13:00 KST
        # FSC releases T-1 business-day data after 13:00; avoid treating
        # 16:00 intraday API response as current-day short positions.
        # Also supports a deliberate free [fsc-now] one-off after key activation.
        if: (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fsc-now]'))
        env:
          FSC_STOCK_LENDING_API_KEY: ${{ secrets.FSC_STOCK_LENDING_API_KEY }}
        run: python fsc_stock_lending.py
      - name: Refresh MFDS device registry (free, optional service key)
        # Existing morning schedule only; no key means explicit not_configured, no API call.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mfds-now]'))
        env:
          MFDS_DEVICE_API_KEY: ${{ secrets.MFDS_DEVICE_API_KEY }}
        run: python mfds_device_registry.py
      - name: Verify MFDS inactive, failure and observed-state UI
        run: |
          node --check assets/mfds_devices.js
          node tests/smoke_mfds.cjs
      - name: Generate APR financial and Google Trends research snapshots (free)
        # Reuse local verified filings and existing Trends observations; no new APIs.
        run: python build_research_data.py
      - name: Verify offline financial, valuation and retail research panels
        run: node tests/smoke_research.cjs
      - name: Verify separated APR scenario engine and KITA leading panel
        run: node tests/smoke_sensitivity.cjs
      - name: Verify APR institution/foreign/short-lending flow UI
        run: node tests/smoke_flows.cjs
      - name: Verify 5 moving averages separate RSI and MACD charts
        run: node tests/smoke_technical_2026.cjs
      - name: Store historical snapshots in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ state/ || true
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh APR public observations [skip ci]"
            git push
          fi
      - name: Generate static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/index.html
          cp assets/style.css assets/apr_theme.css assets/app.js assets/research_dashboard.js assets/mfds_devices.js assets/sensitivity.js assets/flows.js _site/assets/
          cp data/*.json _site/data/
          # Retired raw Top100 and out-of-list BSR must not remain publicly served.
          rm -f _site/data/top100.json _site/data/scrapedo_pdp.json _site/data/discovered_asins.json
          cp data/bootstrap.js _site/data/ 2>/dev/null || true
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload deployable site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
