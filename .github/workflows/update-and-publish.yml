name: APR SIGNAL - free data refresh and Pages

on:
  push:
    branches: [main]
  schedule:
    # 07:30 Korea time (KST, UTC+9) = 22:30 UTC on the preceding date; daily. Cron execution may be delayed.
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apr-signal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check indicator and parsing logic
        run: python -m unittest discover -s tests -v
      - name: Fetch data, calculate signals, update verified news
        # Code-only pushes publish saved data without consuming free API credits.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          APISH_KEY: ${{ secrets.APISH_KEY }}
        run: python build_data.py
      - name: Store historical snapshots in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh APR public observations [skip ci]"
            git push || echo "Warning: unable to commit history; today's published data is still used"
          fi
      - name: Generate static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/index.html
          cp assets/style.css assets/app.js _site/assets/
          cp data/*.json _site/data/
          cp data/bootstrap.js _site/data/ 2>/dev/null || true
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload deployable site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
