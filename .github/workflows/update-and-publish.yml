name: APR SIGNAL - free data refresh and Pages

on:
  push:
    branches: [main]
  schedule:
    # 07:30 Korea time (KST, UTC+9) = 22:30 UTC on the preceding date; daily. Cron execution may be delayed.
    - cron: '30 22 * * *'
    # 16:00 Korea time (KST) = 07:00 UTC; close-price technicals + local news (no paid APIs).
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apr-signal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check indicator and parsing logic
        run: python -m unittest discover -s tests -v
      - name: Verify browser application JavaScript syntax
        run: node --check assets/app.js
      - name: Test Amazon ranking visibility (with and without API / charts)
        run: node tests/smoke_demand.cjs
      - name: Verify Korean news rendering
        run: node tests/smoke_news.cjs
      - name: Verify South America countries without external APIs
        run: node tests/smoke_latam.cjs
      - name: Verify Korean SEC KBTY filing UI
        run: node tests/smoke_kbty_sec.cjs
      - name: Test official Customs freight parsing
        run: python -m unittest tests/test_freight_official.py -v
      - name: Fetch data, calculate signals, update verified news
        # Code-only pushes avoid consuming credits; explicit [collect-now] commit runs one authorized refresh.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect-now]'))
        env:
          APISH_KEY: ${{ secrets.APISH_KEY }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
        run: python build_data.py
      - name: Afternoon 16:00 KST - free close-price technical indicators and local news
        # Actual APR daily OHLCV, recalculated technicals and free RSS only.
        # No Scrape.do, API.SH, ECB or Customs freight requests in this step.
        if: (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[afternoon-now]'))
        run: python afternoon_refresh.py
      - name: News-only manual refresh
        # [news-now] remains news-only for separate manual tests.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[news-now]')
        run: python -c "from build_data import collect_news; collect_news()"
      - name: Refresh Korean news only without Amazon or paid APIs
        # [translate-now] avoids a fresh Amazon collection, preserving credits.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[translate-now]')
        run: python news_localizer.py --refresh-file
      - name: Verify KBTY SEC EDGAR filings (free; fund-series match required)
        # Daily morning SEC refresh; [sec-now] checks SEC only without Amazon/Trends.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[collect-now]') || contains(github.event.head_commit.message, '[sec-now]')))
        run: python kbty_sec.py --refresh
      - name: Refresh KBTY SEC EDGAR series-verified filings (free)
        # SEC only. [sec-now] never invokes Amazon/Trends or whole APR collection.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[collect-now]') || contains(github.event.head_commit.message, '[sec-now]')))
        run: python kbty_sec.py --refresh
      - name: Store historical snapshots in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh APR public observations [skip ci]"
            git push || echo "Warning: unable to commit history; today's published data is still used"
          fi
      - name: Generate static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/index.html
          cp assets/style.css assets/app.js _site/assets/
          cp data/*.json _site/data/
          cp data/bootstrap.js _site/data/ 2>/dev/null || true
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload deployable site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
