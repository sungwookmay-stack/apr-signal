name: APR read-only Naver investor trend probe (temporary)
on:
  push:
    branches: [feat/naver-public-flow-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public investor data endpoints (no account, no secrets)
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          urls=[
            "https://stock.naver.com/api/domestic/detail/278470/trend?tradeType=KRX&startIdx=0&pageSize=20",
            "https://m.stock.naver.com/front-api/stock/domestic/trend?code=278470",
            "https://m.stock.naver.com/api/stock/278470/integration",
          ]
          for u in urls:
            print("ENDPOINT",u.split("?")[0],flush=True)
            req=urllib.request.Request(u,headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Referer':'https://stock.naver.com/domestic/stock/278470/investmentinfo',
            })
            try:
              with urllib.request.urlopen(req,timeout=13) as r:
                body=r.read(600000).decode('utf-8','replace')
                print("STATUS",r.status,"SIZE",len(body),flush=True)
              doc=json.loads(body)
              def describe(d,depth=0):
                if isinstance(d,dict):
                  print("FIELDS",depth,list(d.keys())[:35],flush=True)
                  if depth<3:
                    for k,v in d.items():
                      if isinstance(v,list):
                        print("LIST",k,len(v),flush=True)
                        if v:describe(v[0],depth+1)
                      elif isinstance(v,dict):
                        print("OBJECT",k,flush=True);describe(v,depth+1)
                elif isinstance(d,list):
                  print("LIST_ROOT",len(d),flush=True)
                  if d:describe(d[0],depth+1)
              describe(doc)
              print("SAMPLE_PUBLIC",json.dumps(doc,ensure_ascii=False)[:1100],flush=True)
            except Exception as e:
              print("ERROR",type(e).__name__,str(e)[:150],flush=True)
          PY
